services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Sadece cache olarak kullanılıyor kalıcılık istemiyorsak volume
    # bağlamaya gerek yok. Konteyner yeniden başlarsa cache boşalır,
    # uygulama MGM'den taze veri çeker

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      # .env yoksa hata vermeden devam eder; tüm ayarlar aşağıdaki
      # environment bloğundaki varsayılanlarla çalışır
      - path: .env
        required: false
    environment:
      # Bu servis Redis'i bu compose dosyasındaki `redis` servisinden
      # kullanır. .env'de veya kabukta MGM_REDIS_URL set edilirse o
      # değer geçerli olur
      MGM_REDIS_URL: ${MGM_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy

  # --- İzleme (opsiyonel) ---
  # Varsayılan `docker compose up` bu iki servisi BAŞLATMAZ (profiles
  # sayesinde). Etkinleştirmek için:
  #   docker compose --profile monitoring up -d
  # Detaylar: docs/monitoring.md
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # GRAFANA_ADMIN_PASSWORD env değişkeniyle set edilirse Grafana ilk
      # girişte parola değiştirme istemini atlar; üretimde mutlaka
      # değiştirin, varsayılan admin/admin yalnızca yerel/demo içindir
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

