openapi: 3.0.3
info:
  title: Hava Durumu API
  version: "1.0.0"
  description: >
    MGM (Meteoroloji Genel Müdürlüğü) verisini kullanan ve resmi olmayan bir REST
    API. Redis destekli önbellek, stale-while-revalidate ve MGM kesintilerine
    karşı circuit breaker içerir bkz. README.md
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Yerel geliştirme

tags:
  - name: iller
    description: İl/ilçe ve istasyon bilgisi
  - name: hava-durumu
    description: Güncel durum, tahmin, birleşik özet
  - name: uyarilar
    description: Meteorolojik uyarılar (deneysel, ham geçiş)
  - name: harita
    description: GeoJSON harita verisi (Leaflet/Mapbox uyumlu)
  - name: favoriler
    description: Kimlik doğrulamasız, istemci tanımlı liste_id ile favori il/ilçe listeleri
  - name: durum
    description: Servis sağlığı

paths:
  /iller:
    get:
      tags: [iller]
      summary: Türkiye'nin 81 ilini listeler
      description: >
        Sabit veridir; MGM'ye istek atmaz, önbellek/circuit breaker'dan
        etkilenmez. Plaka kodu sırasıyla döner.
      responses:
        "200":
          description: İl listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      $ref: "#/components/schemas/Il"

  /ara:
    get:
      tags: [hava-durumu]
      summary: Serbest metin sorgusuyla hava durumu (yazım hatası/karmaşık girdi)
      description: >
        `"kadıköy"`, `"kadikoy"`, `"kadikoy/istanbul"`, `"maslak itü"` gibi
        eksik veya hatalı Türkçe karakterli ya da il+ilçe'yi tek metinde birleşik
        veren girdileri çözer. Katmanlı çalışır: önce 81 il listesiyle
        tam eşleşmeye bakar, sonra `/`, `,` veya boşlukla
        ayrılmış parçalardan il+ilçe çıkarıp MGM'ye doğrudan sorar, hâlâ
        çözemezse key gerektirmeyen Open-Meteo geocoding servisine düşer. 
        Yanıttaki `yontem` alanı hangi katmanın çözdüğünü gösterir.
      parameters:
        - name: q
          in: query
          required: true
          description: Serbest metin yer sorgusu
          schema:
            type: string
            example: "maslak itü"
      responses:
        "200":
          description: >
            Çözüldü ya da belirsiz
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    oneOf:
                      - $ref: "#/components/schemas/AramaCozuldu"
                      - $ref: "#/components/schemas/AramaBelirsiz"
        "400":
          description: "'q' parametresi eksik ya da boş"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"
        "404":
          description: Sorgu hiçbir yere çözümlenemedi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /uyarilar:
    get:
      tags: [uyarilar]
      summary: Meteorolojik uyarılar (deneysel — MGM şeması doğrulanmadı)
      description: >
        MGM'nin meteorolojik uyarı (MeteoUYARI) verisini döndürür. **Önemli
        sınır:** bu uç nokta diğerlerinden farklıdır — MGM'nin ham JSON
        şemasını, bu API'nin geliştirildiği sırada Türkiye genelinde aktif
        bir uyarı bulunmadığı için doğrulayamadık. Bu yüzden veri
        dönüştürülmeden, MGM'den geldiği gibi `ham` alanı altında döner;
        alan adlarını tahmin ederek Türkçeleştirme/yeniden şekillendirme
        yapılmaz. MGM'nin resmi MeteoUYARI sistemi şiddet için
        Yeşil/Sarı/Turuncu/Kırmızı, hadise tipi için Soğuk/Sıcak/Sis/Zirai
        Don/Buzlanma ve Don/Toz Taşınımı/Kar Erimesi/Çığ/Kar/Gökgürültülü
        Sağanak Yağış/Rüzgar/Yağmur kategorilerini kullanıyor (bkz.
        mgm.gov.tr/meteouyari) — ama bu kategorilerin MGM'nin JSON
        yanıtındaki gerçek alan adları doğrulanmadan varsayılmadı.
      parameters:
        - name: il
          in: query
          required: false
          description: >
            MGM'ye doğrudan parametre olarak iletilir. Filtrenin MGM
            tarafında gerçekten desteklenip desteklenmediği doğrulanamadı
            (aktif uyarı olmadığından test edilemedi) — zararsız bir
            passthrough'tur.
          schema:
            type: string
            example: istanbul
      responses:
        "200":
          description: MGM'nin ham uyarı verisi (dönüştürülmemiş)
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: object
                    properties:
                      ham:
                        type: array
                        description: MGM'den geldiği gibi, dönüştürülmemiş dizi. Aktif uyarı yoksa boş.
                        items: { type: object }
                      not:
                        type: string
                        description: Şemanın neden doğrulanamadığını açıklayan not.
        "502":
          description: MGM'ye ulaşılamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /konum:
    get:
      tags: [hava-durumu]
      summary: GPS koordinatından hava durumu
      description: >
        Enlem ve boylamı OpenStreetMap'in ücretsiz Nominatim servisiyle
        bir il/ilçe adayına çevirir. MGM'de karşılığı yoksa
        doğrudan verilen koordinatla Open-Meteo'dan güncel durum döner
      parameters:
        - name: lat
          in: query
          required: true
          description: Enlem, -90 ile 90 arası
          schema:
            type: number
            example: 40.99
        - name: lon
          in: query
          required: true
          description: Boylam, -180 ile 180 arası
          schema:
            type: number
            example: 29.02
      responses:
        "200":
          description: Çözüldü
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/KonumCozuldu"
        "400":
          description: "'lat'/'lon' eksik, sayı değil ya da aralık dışı"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"
        "502":
          description: Hem MGM hem Open-Meteo'ya ulaşılamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /toplu:
    post:
      tags: [hava-durumu]
      summary: Tek istekte birden çok yer için hava durumu (akıllı toplu sorgu)
      description: >
        Her sorgu `/ara` ile aynı akıllı çözümleyiciyi kullanır "istanbul",
        "kadikoy/istanbul", "maslak itü" gibi serbest metinler burada da
        geçerlidir. Kısmi başarısızlığa toleranslıdır: bir sorgu
        çözülemese bile diğerleri etkilenmez, yanıt her zaman `200`
        döner ve her öğe kendi `basarili`/`hata` durumunu taşır. 
        Sonuç dizisi istek sırasıyla birebir aynı sırada döner.

        Batch boyutu sınırlıdıraksi halde tek bir isteğe çok sayıda sorgu sıkıştırmak, 
        rate limit'i fiilen bypass etmenin bir yolu olurdu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sorgular]
              properties:
                sorgular:
                  type: array
                  description: Boş olmayan, en fazla APP_TOPLU_MAX_SORGU (varsayılan 20) öğelik metin listesi.
                  items: { type: string }
                  example: ["istanbul", "kadikoy/istanbul", "maslak itü"]
      responses:
        "200":
          description: Batch işlendi (öğelerin kendi başarı durumu ayrı ayrı taşınır)
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      type: object
                      properties:
                        sorgu: { type: string, example: "kadikoy/istanbul" }
                        basarili: { type: boolean }
                        veri:
                          $ref: "#/components/schemas/AramaCozuldu"
                        hata:
                          type: string
                          description: Yalnızca basarili=false iken bulunur.
        "400":
          description: "Gövde JSON değil, 'sorgular' eksik/boş/liste değil ya da limit aşıldı"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /favoriler/{liste_id}:
    parameters:
      - name: liste_id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{3,64}$" }
        description: >
          İstemcinin kendi seçtiği/ürettiği bir kimlik (örn. cihazda
          üretilip saklanan bir UUID). Hesap/kimlik doğrulama YOKTUR —
          liste_id'yi bilen herkes o listeyi okur/düzenler, paylaşılmayan
          bir Pastebin linki gibi ele alınmalıdır.
    post:
      tags: [favoriler]
      summary: Favori ekle/güncelle
      description: >
        Listeye bir sorgu ekler (aynı sorgu tekrar eklenirse zaman damgası
        güncellenir). Liste başına en fazla APP_FAVORI_MAX_KAYIT
        (varsayılan 30) kayıt. REDIS_URL tanımlıysa kalıcıdır
        (APP_FAVORI_TTL_SANIYE, varsayılan 90 gün hareketsizlikte düşer);
        tanımlı değilse yalnızca tek worker'ın belleğinde tutulur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sorgu]
              properties:
                sorgu:
                  type: string
                  maxLength: 100
                  example: "kadikoy/istanbul"
      responses:
        "200":
          description: Kayıt eklendi/güncellendi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/FavoriKaydi"
        "400":
          description: Geçersiz liste_id, eksik/çok uzun sorgu ya da liste limiti aşıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"
    delete:
      tags: [favoriler]
      summary: Favori sil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sorgu]
              properties:
                sorgu: { type: string, example: "kadikoy/istanbul" }
      responses:
        "200":
          description: Silindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
        "404":
          description: Sorgu listede bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"
    get:
      tags: [favoriler]
      summary: Favori listesi için hava durumu
      description: >
        Listedeki tüm sorgular için hava durumunu tek istekte döner
        (/toplu ile aynı akıllı çözümleyici + paralel yürütme, kısmi
        başarısızlığa toleranslı).
      responses:
        "200":
          description: Liste boşsa boş dizi, doluysa /toplu ile aynı formatta sonuç dizisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      type: object
                      properties:
                        sorgu: { type: string }
                        basarili: { type: boolean }
                        veri:
                          $ref: "#/components/schemas/AramaCozuldu"
                        hata: { type: string }
        "400":
          description: Geçersiz liste_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /favoriler/{liste_id}/liste:
    parameters:
      - name: liste_id
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{3,64}$" }
    get:
      tags: [favoriler]
      summary: Kayıtlı sorguları listele (hava durumu çekmeden)
      description: Hafif uç nokta; yalnızca kayıtlı sorgu + eklenme tarihini döner, MGM'ye istek atmaz.
      responses:
        "200":
          description: Kayıtlı favoriler
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      $ref: "#/components/schemas/FavoriKaydi"
        "400":
          description: Geçersiz liste_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HataYaniti"

  /istasyonlar/{il}:
    get:
      tags: [iller]
      summary: Bir ildeki tüm MGM istasyonlarını (ilçelerini) listeler
      parameters:
        - $ref: "#/components/parameters/IlPath"
      responses:
        "200":
          description: İstasyon listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      $ref: "#/components/schemas/Istasyon"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /guncel/{il}:
    get:
      tags: [hava-durumu]
      summary: Anlık (güncel) hava durumu
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Güncel durum
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/GuncelDurum"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /hava-kalitesi/{il}:
    get:
      tags: [hava-durumu]
      summary: Anlık UV indeksi ve hava kalitesi (PM10, PM2.5, NO2)
      description: >
        Öncelik İBB'nin resmi hava kalitesi ölçüm ağındadır (yalnızca
        İstanbul'u kapsar); PM2.5 ve UV indeksi bu serviste bulunmadığından
        her zaman Open-Meteo Air Quality API'siyle tamamlanır. İBB'ye hiç
        ulaşılamazsa (İstanbul dışı il, istasyon/servis hatası vb.) tüm
        alanlar Open-Meteo'dan gelir.
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Hava kalitesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/HavaKalitesi"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /gun-ay-bilgisi/{il}:
    get:
      tags: [hava-durumu]
      summary: Gün doğumu, gün batımı ve ay evresi
      description: >
        Verilen il/ilçenin koordinatı için gün doğumu/batımı
        ve ay evresi döner. Aynı bilgi /hava-durumu
        yanıtına da "ayEvresi" alanı olarak otomatik eklenir.
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Gün ve ay bilgisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/GunAyBilgisi"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /sondurum/en-dusuk-sicakliklar:
    get:
      tags: [hava-durumu]
      summary: Türkiye geneli gerçekleşen en düşük sıcaklıklar
      parameters:
        - name: tarih
          in: query
          required: false
          schema: { type: string, example: "2026-08-26" }
      responses:
        "200":
          description: Tarih + kayıt listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/SondurumSicaklikListesi"

  /sondurum/en-yuksek-sicakliklar:
    get:
      tags: [hava-durumu]
      summary: Türkiye geneli gerçekleşen en yüksek sıcaklıklar
      parameters:
        - name: tarih
          in: query
          required: false
          schema: { type: string, example: "2026-08-26" }
      responses:
        "200":
          description: Tarih + kayıt listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/SondurumSicaklikListesi"

  /polen/{il}:
    get:
      tags: [hava-durumu]
      summary: Polen / alerji indeksi
      description: >
        Anlık polen konsantrasyonu (çimen, huş, kızılağaç, pelin otu,
        zeytin, ambrosia) ve her tür için basitleştirilmiş risk seviyesi
        (Yok/Düşük/Orta/Yüksek/Çok Yüksek) döner. Open-Meteo Air Quality
        API'sinden (CAMS Avrupa modeli, key gerektirmez) beslenir; CAMS
        polen verisi yalnızca Avrupa bölgesini ve ilgili türün sezonunu
        kapsadığından, kapsam dışı türler için değer null ve
        seviye "Veri Yok" döner. Risk seviyeleri EAN/CAMS tabanlı
        yaklaşık sınıflandırmadır, kesin klinik eşik değildir.
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Polen indeksi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/PolenIndeksi"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /deniz/{il}:
    get:
      tags: [hava-durumu]
      summary: Deniz suyu sıcaklığı + dalga durumu
      description: >
        Anlık deniz suyu sıcaklığı ve dalga durumu döner.
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
        - name: lat
          in: query
          required: false
          schema: { type: number }
          description: İl merkez istasyonu yerine kullanılacak enlem (kıyıya yakın nokta için)
        - name: lon
          in: query
          required: false
          schema: { type: number }
          description: İl merkez istasyonu yerine kullanılacak boylam (kıyıya yakın nokta için)
      responses:
        "200":
          description: Deniz durumu
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/DenizDurumu"
        "400":
          description: Geçersiz lat/lon parametresi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: false }
                  hata: { type: string }
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /map/geojson:
    get:
      tags: [harita]
      summary: İl sınırları GeoJSON + son durum sıcaklıkları
      description: >
        Türkiye'nin 81 il sınırını (GeoJSON, açık kaynak/OSM türevi) MGM
        son durum sıcaklıklarıyla birleştirip tek bir FeatureCollection
        olarak döner.
      responses:
        "200":
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaritaGeoJSON"
        "502":
          description: Sınır verisi kaynağına ulaşılamadı
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: false }
                  hata: { type: string }

  /don-uyarisi/{il}:
    get:
      tags: [hava-durumu]
      summary: Tarımsal don/kırağı riski (5 günlük, sezgisel)
      description: >
        5 günlük tahminin en düşük sıcaklığına dayalı sezgisel don/kırağı
        risk sınıflandırması (Kırağı Riski / Hafif-Orta-Kuvvetli-Çok
        Kuvvetli Don) döner. MGM'nin resmi don uyarısı değildir
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Don/kırağı risk tahmini
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/DonKiragiRiski"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /tahmin/{il}:
    get:
      tags: [hava-durumu]
      summary: 5 günlük hava tahmini
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Günlük tahmin listesi (5 gün)
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      $ref: "#/components/schemas/GunlukTahmin"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /saatlik/{il}:
    get:
      tags: [hava-durumu]
      summary: Saatlik hava tahmini (MGM'de mevcutsa)
      description: >
        MGM'nin ham saatlik tahmin kaydını döner; alanlar istasyona göre
        değişebileceğinden şema serbest formatlıdır.
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Saatlik tahmin listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    type: array
                    items:
                      type: object
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /hava-durumu/{il}:
    get:
      tags: [hava-durumu]
      summary: Güncel durum + 5 günlük tahmin + gün doğumu/batımı (birleşik)
      description: >
        `/guncel`, `/tahmin` ve gün doğumu/batımı verisini tek istekte
        toplayan üst düzey uç nokta. Gün doğumu/batımı verisi ayrı bir dış
        servisten geldiği için başarısız olursa atlanır
      parameters:
        - $ref: "#/components/parameters/IlPath"
        - $ref: "#/components/parameters/IlceQuery"
      responses:
        "200":
          description: Birleşik hava durumu özeti
          content:
            application/json:
              schema:
                type: object
                properties:
                  basarili: { type: boolean, example: true }
                  veri:
                    $ref: "#/components/schemas/HavaDurumuOzeti"
        "404":
          $ref: "#/components/responses/BulunamadiHatasi"

  /health:
    get:
      tags: [durum]
      summary: Servis sağlığı
      description: >
        `deep` parametresiz: sadece process'in ayakta olduğunu
        doğrular, MGM/Redis'e istek atmaz ve rate limit'e uğramaz.
        `?deep=1` gerçekten MGM'ye bir istek atar ve Redis bağlantısını
        kontrol eder buna göre MGM veya Redis çökükse 503 döner.
      parameters:
        - name: deep
          in: query
          required: false
          description: "1/true/yes/on değerlerinden biriyse derin kontrol yapılır."
          schema:
            type: string
            example: "1"
      responses:
        "200":
          description: Servis sağlıklı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaglikDurumu"
        "503":
          description: MGM veya Redis'e ulaşılamıyor (yalnızca deep=1 iken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaglikDurumu"

  /metrics:
    get:
      tags: [durum]
      summary: Prometheus formatında metrikler
      description: >
        HTTP istek sayısı/süresi, cache hit/stale_hit/miss
        oranı, circuit breaker durumu, rate limit reddi sayısı
        rate limite tabi değildir. OpenTelemetry/trace
        desteği bilinçli olarak eklenmedi
      responses:
        "200":
          description: Prometheus text formatı
          content:
            text/plain:
              schema:
                type: string
                example: |
                  http_requests_total{method="GET",endpoint="iller",status="200"} 3.0
                  mgm_circuit_breaker_state 0.0

components:
  parameters:
    IlPath:
      name: il
      in: path
      required: true
      description: "İl adı. Türkçe karakter sorunu yaşanırsa aksansız yazın (Istanbul, Bakirkoy)."
      schema:
        type: string
        example: Istanbul
    IlceQuery:
      name: ilce
      in: query
      required: false
      description: >
        Belirtilmezse MGM'nin o il için döndürdüğü varsayılan istasyon
        kullanılır.
      schema:
        type: string
        example: Bakirkoy

  responses:
    BulunamadiHatasi:
      description: İl/ilçe/istasyon bulunamadı ya da MGM'den veri alınamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HataYaniti"

  schemas:
    Il:
      type: object
      properties:
        plakaKodu: { type: integer, example: 34 }
        il: { type: string, example: İstanbul }

    Istasyon:
      type: object
      description: MGM'nin ham istasyon/merkez kaydı; alan adları istasyona göre değişebilir.
      properties:
        istasyonId: { type: integer, example: 17062 }
        merkezId: { type: integer, example: 17062 }
        il: { type: string, example: İstanbul }
        ilce: { type: string, example: Bakırköy }
        enlem: { type: number, example: 40.98 }
        boylam: { type: number, example: 28.87 }
      additionalProperties: true

    GuncelDurum:
      type: object
      description: >
        `kaynak: "mgm"` normal yanıttır. MGM'ye ulaşılamadığında (circuit
        breaker açık dahil) `kaynak: "open-meteo"` ile ücretsiz, key
        gerektirmeyen bir yedek servisten gelen veri döner
      properties:
        istasyonId: { type: integer, example: 17062 }
        sicaklik: { type: number, nullable: true, example: 21.4 }
        nem: { type: number, nullable: true, example: 62 }
        ruzgarHizi: { type: number, nullable: true, example: 11.2 }
        ruzgarYonu: { type: number, nullable: true, example: 180 }
        basinc: { type: number, nullable: true, example: 1013.2 }
        denizSeviyesiBasinc: { type: number, nullable: true, example: 1015.1 }
        durumKodu:
          nullable: true
          example: 1
          description: "kaynak=mgm iken MGM kodu (string), kaynak=open-meteo iken WMO kodu (integer)"
        durum: { type: string, nullable: true, example: Açık }
        olcumZamani: { type: string, nullable: true, example: "2026-08-15 09:00:00" }
        kaynak:
          type: string
          enum: [mgm, open-meteo]
          example: mgm
          description: Verinin hangi servisten geldiği.

    GunlukTahmin:
      type: object
      properties:
        tarih: { type: string, format: date, example: "2026-08-15" }
        enDusuk: { type: number, nullable: true, example: 18.0 }
        enYuksek: { type: number, nullable: true, example: 29.5 }
        enDusukNem: { type: number, nullable: true, example: 45 }
        enYuksekNem: { type: number, nullable: true, example: 70 }
        ruzgarHizi: { type: number, nullable: true, example: 9.5 }
        durumKodu: { type: integer, nullable: true, example: 1 }
        durum: { type: string, nullable: true, example: Açık }

    HavaDurumuOzeti:
      type: object
      properties:
        il: { type: string, example: İstanbul }
        ilce: { type: string, nullable: true, example: Bakırköy }
        istasyonId: { type: integer, example: 17062 }
        enlem: { type: number, nullable: true, example: 40.98 }
        boylam: { type: number, nullable: true, example: 28.87 }
        guncel: { $ref: "#/components/schemas/GuncelDurum" }
        tahmin:
          type: array
          items: { $ref: "#/components/schemas/GunlukTahmin" }
        gunDogumu: { type: string, nullable: true, example: "06:12" }
        gunBatimi: { type: string, nullable: true, example: "19:48" }
        ayEvresi:
          allOf:
            - $ref: "#/components/schemas/GunAyBilgisi/properties/ayEvresi"
          nullable: true

    AramaCozuldu:
      allOf:
        - $ref: "#/components/schemas/HavaDurumuOzeti"
        - type: object
          properties:
            durum: { type: string, enum: [cozuldu], example: cozuldu }
            sorgu: { type: string, example: "maslak itü" }
            yontem:
              type: string
              enum: [il-eslesme, il-ilce-parcalama, geocoding-mgm, geocoding-dogrudan]
              description: >
                il-eslesme/il-ilce-parcalama: MGM üzerinden tam hava_durumu
                yanıtı. geocoding-mgm: Open-Meteo geocoding ile bulunan
                il/ilçe MGM'de de doğrulandı. geocoding-dogrudan: MGM'de
                karşılığı yok (ör. resmi ilçe olmayan bir mahalle),
                `guncel` doğrudan Open-Meteo'dan; `tahmin` boş liste.
              example: geocoding-dogrudan

    HavaKalitesi:
      type: object
      description: >
        Her alanın hangi servisten geldiği `kaynaklar` içinde ayrı ayrı
        belirtilir, çünkü İBB ve Open-Meteo aynı yanıtta karışık kullanılabilir.
      properties:
        pm10: { type: number, nullable: true, example: 34.2 }
        pm25: { type: number, nullable: true, example: 14.4 }
        no2: { type: number, nullable: true, example: 21.7 }
        uvIndeksi: { type: number, nullable: true, example: 6.2 }
        avrupaHKI:
          type: integer
          nullable: true
          description: Open-Meteo Avrupa Hava Kalitesi İndeksi (0-100+)
          example: 38
        olcumZamani: { type: string, nullable: true, example: "2026-08-24T09:00:00" }
        istasyon:
          type: object
          nullable: true
          description: PM10/NO2 için kullanılan İBB istasyonu; İBB devrede değilse null
          properties:
            ad: { type: string, example: Kadıköy }
            adres: { type: string, nullable: true, example: "Kadıköy/İstanbul" }
            enlem: { type: number, example: 40.9906 }
            boylam: { type: number, example: 29.0274 }
        kaynaklar:
          type: object
          description: "Her alan için: ibb | open-meteo"
          properties:
            pm10: { type: string, enum: [ibb, open-meteo] }
            pm25: { type: string, enum: [open-meteo] }
            no2: { type: string, enum: [ibb, open-meteo] }
            uvIndeksi: { type: string, enum: [open-meteo] }

    HaritaGeoJSON:
      type: object
      description: RFC 7946 FeatureCollection; Leaflet/Mapbox'a doğrudan verilebilir.
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [Feature] }
              geometry:
                type: object
                description: Polygon veya MultiPolygon (GeoJSON standardı)
              properties:
                type: object
                properties:
                  il: { type: string, example: "İstanbul" }
                  sicaklik:
                    type: number
                    nullable: true
                    description: Son durum sıcaklığı (°C); bulunamazsa null
                    example: 24.3
                  durum:
                    type: string
                    nullable: true
                    example: "Az Bulutlu"
                  guncellemeZamani: { type: string, nullable: true }

    DonKiragiRiski:
      type: object
      description: >
        MGM'nin resmi bir don uyarı ürünü değildir; 5 günlük sıcaklık
        tahmininden türetilmiş sezgisel bir risk göstergesidir.
      properties:
        il: { type: string, example: "Erzurum" }
        ilce: { type: string, nullable: true }
        genelRiskSeviyesi:
          type: string
          enum:
            - Risk Yok
            - Bilinmiyor
            - Kırağı Riski
            - Hafif Don
            - Orta Don
            - Kuvvetli Don
            - Çok Kuvvetli Don
          example: "Kuvvetli Don"
        gunler:
          type: array
          items:
            type: object
            properties:
              tarih: { type: string, example: "2026-01-10" }
              enDusukSicaklik: { type: number, nullable: true, example: -6 }
              seviye: { type: string, example: "Kuvvetli Don" }
              aciklama:
                type: string
                example: "Çoğu bitki türü için zarar riski yüksek."
              kiragiKosuluUygun:
                type: boolean
                description: >
                  Düşük rüzgar (<10 km/h) + yüksek nem (>%60) birlikte
                  görüldüğünde radyatif kırağı için elverişli koşul
                example: true
        aciklama: { type: string }

    PolenIndeksi:
      type: object
      description: >
        EAN/CAMS tabanlı yaklaşık sınıflandırmadır, kesin klinik eşik
        değildir. CAMS yalnızca Avrupa bölgesini ve ilgili türün
        sezonunu kapsar.
      properties:
        turler:
          type: object
          description: Anahtar polen türü (örn. grass_pollen); değer detay nesnesi.
          additionalProperties:
            type: object
            properties:
              ad: { type: string, example: "cimen" }
              deger:
                type: number
                nullable: true
                description: Grains/m³ (kapsam/sezon dışıysa null)
                example: 65
              birim: { type: string, example: "Grains/m³" }
              seviye:
                type: string
                enum: [Veri Yok, Yok, Düşük, Orta, Yüksek, Çok Yüksek]
                example: "Yüksek"
        baskinTur:
          type: string
          nullable: true
          description: En yüksek risk seviyesindeki tür (Türkçe adı)
          example: "cimen"
        genelRiskSeviyesi:
          type: string
          enum: [Veri Yok, Yok, Düşük, Orta, Yüksek, Çok Yüksek]
          example: "Yüksek"
        olcumZamani: { type: string, nullable: true }
        kaynak: { type: string, example: "open-meteo (CAMS Avrupa)" }
        aciklama: { type: string }

    DenizDurumu:
      type: object
      properties:
        denizSuyuSicakligi:
          type: number
          nullable: true
          description: "°C; karasal/kapsam dışı konumda null"
          example: 24.8
        dalgaYuksekligi:
          type: number
          nullable: true
          description: "metre; karasal/kapsam dışı konumda null"
          example: 0.8
        dalgaPeriyodu: { type: number, nullable: true, description: "saniye" }
        dalgaYonu: { type: number, nullable: true, description: "derece (0-360)" }
        istasyon:
          type: object
          nullable: true
          description: Sıcaklık Piri Reis'ten geldiyse eşleşen istasyon bilgisi
          properties:
            ad: { type: string, example: "İSTANBUL/FLORYA" }
            il: { type: string, nullable: true }
            ilce: { type: string, nullable: true }
            enlem: { type: number }
            boylam: { type: number }
        kaynaklar:
          type: object
          description: Her alanın hangi kaynaktan geldiğini gösterir.
          properties:
            denizSuyuSicakligi:
              type: string
              enum: [piri-reis, open-meteo]
              example: "piri-reis"
            dalga:
              type: string
              enum: [open-meteo]
              example: "open-meteo"
        kapsamDisi:
          type: boolean
          description: >
            true ise verilen koordinat ne Piri Reis'in ne de Open-Meteo
            deniz modelinin kapsamındadır (örn. karasal bir il merkezi)
            tüm alanlar null olur
          example: false
        olcumZamani: { type: string, nullable: true }
        aciklama: { type: string, nullable: true }

    GunAyBilgisi:
      type: object
      properties:
        gunDogumu: { type: string, example: "06:12" }
        gunBatimi: { type: string, example: "19:47" }
        ayEvresi:
          type: object
          properties:
            evreAdi:
              type: string
              enum:
                - Yeni Ay
                - "Hilal (Büyüyen)"
                - İlk Dördün
                - "Şişkin Ay (Büyüyen)"
                - Dolunay
                - "Şişkin Ay (Küçülen)"
                - Son Dördün
                - "Hilal (Küçülen)"
              example: "Şişkin Ay (Büyüyen)"
            yasGunu:
              type: number
              description: Son yeni aydan bu yana geçen gün (0-29.53)
              example: 11.18
            aydinlanmaOrani:
              type: number
              description: Görünen ay diskinin aydınlık oranı (0-1)
              example: 0.62
            buyuyorMu:
              type: boolean
              description: Bir sonraki dolunaya doğru mu ilerliyor
              example: true

    KonumCozuldu:
      allOf:
        - $ref: "#/components/schemas/HavaDurumuOzeti"
        - type: object
          properties:
            durum: { type: string, enum: [cozuldu], example: cozuldu }
            yontem:
              type: string
              enum:
                [
                  nominatim-mgm,
                  nominatim-mgm-il-varsayilan,
                  nominatim-open-meteo,
                  open-meteo-dogrudan,
                ]
              description: >
                nominatim-mgm/nominatim-mgm-il-varsayilan: Nominatim ile
                bulunan il(+ilçe) MGM'de de doğrulandı. 
                nominatim-open-meteo: Nominatim bir adres buldu ama MGM'de karşılığı yoktu.
                open-meteo-dogrudan: Nominatim hiç adres bulamadı ya da servise ulaşılamadı.
              example: nominatim-mgm

    AramaBelirsiz:
      type: object
      properties:
        durum: { type: string, enum: [belirsiz], example: belirsiz }
        sorgu: { type: string, example: "merkez mahallesi" }
        secenekler:
          type: array
          description: Farklı illerde birden fazla makul aday bulundu; tahmin yürütülmedi.
          items:
            type: object
            properties:
              yer: { type: string, example: Merkez }
              il: { type: string, example: Konya }
              ulke: { type: string, example: Türkiye }
              enlem: { type: number, example: 37.87 }
              boylam: { type: number, example: 32.49 }

    SaglikDurumu:
      type: object
      properties:
        basarili: { type: boolean }
        durum: { type: string, enum: [ok, degraded], example: ok }
        servis: { type: string, example: hava-durumu }
        mgm: { type: string, enum: [ok, hata, skip], example: skip }
        redis: { type: string, enum: [ok, hata, skip], example: skip }
        circuit_breaker: { type: string, enum: [kapali, acik, yari-acik], example: kapali }
        hata: { type: string, nullable: true }

    HataYaniti:
      type: object
      properties:
        basarili: { type: boolean, example: false }
        hata: { type: string, example: "'Xyz' için istasyon bulunamadı." }

    SondurumSicaklikListesi:
      type: object
      properties:
        tarih: { type: string, example: "2026-08-26" }
        kayitlar:
          type: array
          items:
            type: object
            properties:
              il: { type: string }
              ilce: { type: string }
              istAd: { type: string }
              deger: { type: number }

    FavoriKaydi:
      type: object
      properties:
        sorgu: { type: string, example: "kadikoy/istanbul" }
        eklenmeTarihi: { type: string, example: "2026-08-26T11:10:45Z" }
