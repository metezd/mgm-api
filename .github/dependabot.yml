version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # Python taban imajının minör/majör sürümü (3.13 -> 3.14 gibi) manuel
      # doğrulama gerektirir: requirements-lock.txt'teki paketlerin cp314
      # wheel'leri olsa da CI Docker build'i test etmiyor (main.yml sadece
      # 3.13 ile lint/test çalıştırıyor), bu yüzden Render'daki asıl deploy
      # build'inde sessizce kırılabiliyor. Patch/digest güncellemeleri
      # (güvenlik yamaları) hâlâ otomatik önerilir.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
