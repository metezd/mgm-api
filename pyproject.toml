[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "mgm-tr"
version = "0.1.0"
description = "Türkiye Meteoroloji Genel Müdürlüğü (MGM) hava durumu verisine bağımsız erişim, HTTP sunucu gerektirmez"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "metezd" }]
keywords = ["mgm", "meteoroloji", "hava-durumu", "turkiye", "weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.urls]
Repository = "https://github.com/metezd/mgm-api"
Issues = "https://github.com/metezd/mgm-api/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]
zamanlayici = ["APScheduler>=3.10"]
sunucu = [
    "flask>=3.0",
    "flask-compress>=1.15",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "redis>=5.0",
    "waitress>=3.0",
]

[tool.setuptools]
py-modules = ["mgm_client"]

[tool.ruff]
line-length = 115
target-version = "py313"

[tool.ruff.lint]
# Bilinçli olarak dar bir set gerçek hataları ve import sıralamasını yakalar
select = ["E", "F", "I"]
